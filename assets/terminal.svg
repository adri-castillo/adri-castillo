<svg fill="none" width="100%" viewBox="0 0 920 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- MÁSCARAS DE CORTE PARA EL EFECTO DE ESCRITURA Y BORRADO REAL -->
    <clipPath id="clip1"><rect class="clip1" x="244" y="555" width="0" height="35" /></clipPath>
    <clipPath id="clip2"><rect class="clip2" x="244" y="555" width="0" height="35" /></clipPath>
    <clipPath id="clip3"><rect class="clip3" x="244" y="555" width="0" height="35" /></clipPath>
    <clipPath id="clip4"><rect class="clip4" x="244" y="555" width="0" height="35" /></clipPath>
    <clipPath id="clip5"><rect class="clip5" x="244" y="555" width="0" height="35" /></clipPath>
    <clipPath id="clip6"><rect class="clip6" x="244" y="555" width="0" height="35" /></clipPath>
  </defs>

  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #8b949e; }
    .term-text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; }
    .cyan { fill: #79c0ff; }
    .purple { fill: #d2a8ff; }
    .white { fill: #c9d1d9; }
    .key { fill: #7ee787; }
    .string { fill: #a5d6ff; }
    .cursor { fill: #79c0ff; animation: blink 0.8s infinite; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Ciclo total de 60s */
    .cmd1 { animation: anim1 60s infinite; }
    .cmd2 { animation: anim2 60s infinite; }
    .cmd3 { animation: anim3 60s infinite; }
    .cmd4 { animation: anim4 60s infinite; }
    .cmd5 { animation: anim5 60s infinite; }
    .cmd6 { animation: anim6 60s infinite; }

    .clip1 { animation: cwidth1 60s infinite linear; }
    .clip2 { animation: cwidth2 60s infinite linear; }
    .clip3 { animation: cwidth3 60s infinite linear; }
    .clip4 { animation: cwidth4 60s infinite linear; }
    .clip5 { animation: cwidth5 60s infinite linear; }
    .clip6 { animation: cwidth6 60s infinite linear; }

    /* Keyframes de Opacidad general por comando */
    @keyframes anim1 { 0% { opacity:1; } 16.0% { opacity:1; } 16.5% { opacity:0; } 100% { opacity:0; } }
    @keyframes anim2 { 0%, 16.5% { opacity:0; } 16.6% { opacity:1; } 32.6% { opacity:1; } 33.1% { opacity:0; } 100% { opacity:0; } }
    @keyframes anim3 { 0%, 33.1% { opacity:0; } 33.3% { opacity:1; } 49.3% { opacity:1; } 49.8% { opacity:0; } 100% { opacity:0; } }
    @keyframes anim4 { 0%, 49.8% { opacity:0; } 50.0% { opacity:1; } 66.0% { opacity:1; } 66.5% { opacity:0; } 100% { opacity:0; } }
    @keyframes anim5 { 0%, 66.5% { opacity:0; } 66.6% { opacity:1; } 82.6% { opacity:1; } 83.1% { opacity:0; } 100% { opacity:0; } }
    @keyframes anim6 { 0%, 83.1% { opacity:0; } 83.3% { opacity:1; } 99.3% { opacity:1; } 99.8% { opacity:0; } 100% { opacity:0; } }

    /* Escritura más lenta y natural, manteniendo la pausa de lectura y el borrado fluido */
    @keyframes cwidth1 { 
      0% { width: 0; } 
      1.0% { width: 0; } 
      9.0% { width: 250px; }   /* Escritura más lenta y pausada */
      13.5% { width: 250px; }  /* Pausa de lectura profunda */
      16.0% { width: 0; }      /* Borrado manual fluido */
      100% { width: 0; } 
    }
    
    @keyframes cwidth2 { 
      0%, 16.6% { width: 0; } 
      17.6% { width: 0; } 
      25.6% { width: 450px; }  /* Escritura más lenta y pausada */
      30.1% { width: 450px; }  /* Pausa de lectura profunda */
      32.6% { width: 0; }      /* Borrado manual fluido */
      100% { width: 0; } 
    }
    
    @keyframes cwidth3 { 
      0%, 33.3% { width: 0; } 
      34.3% { width: 0; } 
      42.3% { width: 500px; }  /* Escritura más lenta y pausada */
      46.8% { width: 500px; }  /* Pausa de lectura profunda */
      49.3% { width: 0; }      /* Borrado manual fluido */
      100% { width: 0; } 
    }
    
    @keyframes cwidth4 { 
      0%, 50.0% { width: 0; } 
      51.0% { width: 0; } 
      59.0% { width: 380px; }  /* Escritura más lenta y pausada */
      63.5% { width: 380px; }  /* Pausa de lectura profunda */
      66.0% { width: 0; }      /* Borrado manual fluido */
      100% { width: 0; } 
    }
    
    @keyframes cwidth5 { 
      0%, 66.6% { width: 0; } 
      67.6% { width: 0; } 
      75.6% { width: 480px; }  /* Escritura más lenta y pausada */
      80.1% { width: 480px; }  /* Pausa de lectura profunda */
      82.6% { width: 0; }      /* Borrado manual fluido */
      100% { width: 0; } 
    }
    
    @keyframes cwidth6 { 
      0%, 83.3% { width: 0; } 
      84.3% { width: 0; } 
      92.3% { width: 420px; }  /* Escritura más lenta y pausada */
      96.8% { width: 420px; }  /* Pausa de lectura profunda */
      99.3% { width: 0; }      /* Borrado manual fluido */
      100% { width: 0; } 
    }
  </style>

  <!-- Fondo de la ventana -->
  <rect width="920" height="630" rx="10" fill="#0d1117" />
  
  <!-- Barra de título macOS -->
  <rect width="920" height="48" rx="10" fill="#161b22" />
  <rect y="20" width="920" height="28" fill="#161b22" />
  <line x1="0" y1="48" x2="920" y2="48" stroke="#30363d" stroke-width="1" />

  <!-- Botones de ventana -->
  <circle cx="22" cy="24" r="7.5" fill="#FF5F56" />
  <circle cx="45" cy="24" r="7.5" fill="#FFBD2E" />
  <circle cx="68" cy="24" r="7.5" fill="#27C93F" />

  <!-- Icono de carpeta azul estilo macOS -->
  <g transform="translate(88, 15)">
    <path d="M2 3A2 2 0 0 1 4 1h4.2a2 2 0 0 1 1.4.6l1.4 1.4A1 1 0 0 0 11.7 3.5H18a2 2 0 0 1 2 2V15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3z" fill="#1b73ba"/>
    <path d="M2 6.5A1.5 1.5 0 0 1 3.5 5h15A1.5 1.5 0 0 1 20 6.5V15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6.5z" fill="#479fe6"/>
    <path d="M3.5 5h15A1.5 1.5 0 0 1 20 6.5V8H2V6.5A1.5 1.5 0 0 1 3.5 5z" fill="#5cb3f6" opacity="0.6"/>
  </g>

  <!-- Título de ventana -->
  <text x="116" y="30" class="header-title">ac — zsh — 80×24</text>

  <!-- Prompt 1: cat profile.json -->
  <text x="22" y="94" class="term-text">
    <tspan class="cyan">dev@macbook-pro</tspan>
    <tspan class="purple"> ~ %</tspan>
    <tspan class="white"> cat profile.json</tspan>
  </text>

  <!-- JSON con resaltado de sintaxis -->
  <text x="22" y="124" class="term-text white">{</text>
  <text x="42" y="154" class="term-text"><tspan class="key">"developer"</tspan><tspan class="white">: </tspan><tspan class="string">"Adriana Castillo"</tspan><tspan class="white">,</tspan></text>
  <text x="42" y="184" class="term-text"><tspan class="key">"bio"</tspan><tspan class="white">: </tspan><tspan class="string">"Building robust web platforms &amp; distributed data pipelines"</tspan><tspan class="white">,</tspan></text>
  <text x="42" y="214" class="term-text"><tspan class="key">"current_focus"</tspan><tspan class="white">: [</tspan></text>
  <text x="62" y="244" class="term-text"><tspan class="string">"Scalable ETL Architectures"</tspan><tspan class="white">,</tspan></text>
  <text x="62" y="274" class="term-text"><tspan class="string">"Real-time Data Processing"</tspan><tspan class="white">,</tspan></text>
  <text x="62" y="304" class="term-text"><tspan class="string">"Integrated Full Stack Solutions"</tspan></text>
  <text x="42" y="334" class="term-text white">],</text>
  <text x="42" y="364" class="term-text"><tspan class="key">"engineering_principles"</tspan><tspan class="white">: [</tspan></text>
  <text x="62" y="394" class="term-text"><tspan class="string">"Clean Code &amp; Maintainability"</tspan><tspan class="white">,</tspan></text>
  <text x="62" y="424" class="term-text"><tspan class="string">"Data Integrity &amp; Efficiency"</tspan><tspan class="white">,</tspan></text>
  <text x="62" y="454" class="term-text"><tspan class="string">"Performance Optimization"</tspan></text>
  <text x="42" y="484" class="term-text white">],</text>
  <text x="42" y="514" class="term-text"><tspan class="key">"spoken_languages"</tspan><tspan class="white">: [</tspan><tspan class="string">"Spanish (Native)"</tspan><tspan class="white">, </tspan><tspan class="string">"English (Technical)"</tspan><tspan class="white">]</tspan></text>
  <text x="22" y="544" class="term-text white">}</text>

  <!-- Prompt 2 (Inferior) -->
  <text x="22" y="584" class="term-text">
    <tspan class="cyan">dev@macbook-pro</tspan>
    <tspan class="purple"> ~ %</tspan>
  </text>

  <!-- COMANDOS DINÁMICOS ANIMADOS EN CSS PURO -->
  <g class="cmd1" clip-path="url(#clip1)">
    <text x="244" y="584" class="term-text white">echo "Hello, World!"<tspan class="cursor"> ▋</tspan></text>
  </g>
  <g class="cmd2" clip-path="url(#clip2)">
    <text x="244" y="584" class="term-text white">git commit -m "feat: ship to prod"<tspan class="cursor"> ▋</tspan></text>
  </g>
  <g class="cmd3" clip-path="url(#clip3)">
    <text x="244" y="584" class="term-text white">ng build --configuration production<tspan class="cursor"> ▋</tspan></text>
  </g>
  <g class="cmd4" clip-path="url(#clip4)">
    <text x="244" y="584" class="term-text white">python3 -m pytest tests/<tspan class="cursor"> ▋</tspan></text>
  </g>
  <g class="cmd5" clip-path="url(#clip5)">
    <text x="244" y="584" class="term-text white">spark-submit --master yarn etl.py<tspan class="cursor"> ▋</tspan></text>
  </g>
  <g class="cmd6" clip-path="url(#clip6)">
    <text x="244" y="584" class="term-text white">docker-compose up -d airflow<tspan class="cursor"> ▋</tspan></text>
  </g>

  <!-- Borde exterior de la ventana -->
  <rect width="920" height="630" rx="10" fill="none" stroke="#30363d" stroke-width="1" />
</svg>
